<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | একতা ফাউন্ডেশন</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><img src="logo.svg"><span>একতা ফাউন্ডেশন<small>Admin Panel</small></span></a></div></header><main class="section"><div class="wrap admin"><div id="login"><div class="heading"><span>নিরাপদ ব্যবস্থাপনা</span><h2>Admin Login</h2><p>Supabase Authentication দিয়ে লগইন করুন।</p></div><label>ইমেইল<input id="email" type="email" autocomplete="username" placeholder="Admin email"></label><label>পাসওয়ার্ড<input id="pass" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড"></label><button class="btn" onclick="login()">লগইন</button><p id="loginMsg" class="msg"></p></div><div id="panel" hidden><div class="adminHead"><div><span>Dashboard</span><h2>সদস্য আবেদন</h2><small>Logged in: <b id="adminEmail"></b></small></div><button class="btn ghost" onclick="logout()">Logout</button></div><div id="apps"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
